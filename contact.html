<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>Vivek - Contact</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
        .main .contact-item p, h2{
            font-family: "Montserrat", sans-serif;
        }
        .submit-btn {
            font-family: "Montserrat", sans-serif;
        }
        .contact-item a {
            font-family: "Montserrat", sans-serif;
        }
    </style>
</head>
<body class="content-page">
    <header class="header-bg">
        <nav>
            <ul>
                <li><a href="index.html" style="text-decoration: none;">Home</a></li>
                <li><a href="projects.html" style="text-decoration: none;">Projects</a></li>
                <li><a href="contact.html" style="text-decoration: none;">Contact Me</a></li>
            </ul>
        </nav>
    </header>
    <div class="main">
        <div class="contact-container">
            <h1 class="page-title">Get In Touch</h1>
            
            <div class="contact-info">
                <div class="contact-item">
                    <h2>Email</h2>
                    <p><a href="mailto:vivekjoshi82015@gmail.com">vivekjoshi82015@gmail.com</a></p>
                </div>
                
                <div class="contact-item">
                    <h2>LinkedIn</h2>
                    <p><a href="https://linkedin.com/in/vivek-upadhayay" target="_blank">linkedin.com/in/vivek-upadhayay</a></p>
                </div>
                
                <div class="contact-item">
                    <h2>GitHub</h2>
                    <p><a href="https://github.com/notvivek12" target="_blank">github.com/notvivek12</a></p>
                </div>
            </div>
            
            <div class="contact-form">
                <h2>Send a Message</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
                <div id="formStatus" style="margin-top: 15px; text-align: center; display: none;"></div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            const formStatus = document.getElementById('formStatus');
            
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Google Apps Script URL - replace with your new deployment URL if different
                const scriptURL = 'https://script.google.com/macros/s/AKfycbzAnynXGuJySWOR6pFWWlbqwNE3O6SX6MKcYNz4zPSrg2z74w7uhda6zsdy7xQId_xl/exec';
                
                // Show loading message
                formStatus.style.display = 'block';
                formStatus.innerHTML = '<p style="color: #00ffff;">Sending your message...</p>';
                
                // Get form data
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const message = document.getElementById('message').value;
                
                // Log the data we're sending (for debugging)
                console.log('Sending form data:');
                console.log('Name:', name);
                console.log('Email:', email);
                console.log('Message:', message);
                
                // Method 1: Direct form submission through a hidden iframe
                const iframe = document.createElement('iframe');
                iframe.name = 'hidden_iframe';
                iframe.id = 'hidden_iframe';
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                
                // Set up the form for submission
                contactForm.target = 'hidden_iframe';
                contactForm.action = scriptURL;
                contactForm.method = 'POST';
                
                // Add a callback when the iframe loads
                iframe.onload = function() {
                    // Success message
                    formStatus.innerHTML = '<p style="color: #00ffff;">Message sent successfully! Thank you for contacting me.</p>';
                    contactForm.reset();
                    
                    // Remove the iframe after a delay
                    setTimeout(() => {
                        document.body.removeChild(iframe);
                        
                        // Hide success message after 5 seconds
                        setTimeout(() => {
                            formStatus.style.display = 'none';
                        }, 5000);
                    }, 1000);
                };
                
                // Submit the form
                contactForm.submit();
                
                // Method 2: Fallback using fetch API with URL parameters
                // This is a backup in case the iframe method fails
                const url = new URL(scriptURL);
                url.searchParams.append('name', name);
                url.searchParams.append('email', email);
                url.searchParams.append('message', message);
                
                fetch(url.toString(), {
                    method: 'GET',
                    mode: 'no-cors'
                }).catch(error => {
                    console.log('Fallback request sent (ignore any CORS errors):', error);
                });
            });
        });
    </script>
</body>
</html>
