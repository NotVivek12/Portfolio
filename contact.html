<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>Vivek - Contact</title>
</head>
<body class="content-page">
    <header class="header-bg">
        <nav>
            <ul>
                <li><a href="index.html" style="text-decoration: none;">Home</a></li>
                <li><a href="projects.html" style="text-decoration: none;">Projects</a></li>
                <li><a href="contact.html" style="text-decoration: none;">Contact Me</a></li>
            </ul>
        </nav>
    </header>
    <div class="main">
        <div class="contact-container">
            <h1 class="page-title">Get In Touch</h1>
            
            <div class="contact-info">
                <div class="contact-item">
                    <h2>Email</h2>
                    <p><a href="mailto:vivekjoshi82015@gmail.com">vivekjoshi82015@gmail.com</a></p>
                </div>
                
                <div class="contact-item">
                    <h2>LinkedIn</h2>
                    <p><a href="https://linkedin.com/in/vivek-upadhayay" target="_blank">linkedin.com/in/vivek-upadhayay</a></p>
                </div>
                
                <div class="contact-item">
                    <h2>GitHub</h2>
                    <p><a href="https://github.com/notvivek12" target="_blank">github.com/notvivek12</a></p>
                </div>
            </div>
            
            <div class="contact-form">
                <h2>Send a Message</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
                <div id="formStatus" style="margin-top: 15px; text-align: center; display: none;"></div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            const formStatus = document.getElementById('formStatus');
            
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Replace with your Google Apps Script URL
                const scriptURL = 'https://script.google.com/macros/s/AKfycbyrYREugMq-cdO-6Yp7n_JJveWOfd6erdpHz_B8ijTFXnp8gbteZAW4bHuVfwf966SO/exec';
                
                // Show loading message
                formStatus.style.display = 'block';
                formStatus.innerHTML = '<p style="color: #00ffff;">Sending your message...</p>';
                
                // Get form data
                const formData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    message: document.getElementById('message').value
                };
                
                // Send data to Google Sheets
                fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    // Success message
                    formStatus.innerHTML = '<p style="color: #00ffff;">Message sent successfully! Thank you for contacting me.</p>';
                    contactForm.reset();
                    
                    // Hide success message after 5 seconds
                    setTimeout(() => {
                        formStatus.style.display = 'none';
                    }, 5000);
                })
                .catch(error => {
                    // Error message
                    console.error('Error!', error.message);
                    formStatus.innerHTML = '<p style="color: #ff6b6b;">Something went wrong. Please try again later.</p>';
                });
            });
        });
    </script>
</body>
</html>
