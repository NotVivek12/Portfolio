<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>Vivek - Contact</title>
</head>
<body class="content-page">
    <header class="header-bg">
        <nav>
            <ul>
                <li><a href="index.html" style="text-decoration: none;">Home</a></li>
                <li><a href="projects.html" style="text-decoration: none;">Projects</a></li>
                <li><a href="contact.html" style="text-decoration: none;">Contact Me</a></li>
            </ul>
        </nav>
    </header>
    <div class="main">
        <div class="contact-container">
            <h1 class="page-title">Get In Touch</h1>
            
            <div class="contact-info">
                <div class="contact-item">
                    <h2>Email</h2>
                    <p><a href="mailto:your.email@example.com">your.email@example.com</a></p>
                </div>
                
                <div class="contact-item">
                    <h2>LinkedIn</h2>
                    <p><a href="https://linkedin.com/in/yourusername" target="_blank">linkedin.com/in/yourusername</a></p>
                </div>
                
                <div class="contact-item">
                    <h2>GitHub</h2>
                    <p><a href="https://github.com/yourusername" target="_blank">github.com/yourusername</a></p>
                </div>
            </div>
            
            <div class="contact-form">
                <h2>Send a Message</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
